<svg width="100%" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#151d34"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3da9fc" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#3da9fc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3da9fc" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#grid)" opacity="0.5"/>

  <!-- energy burst behind character -->
  <g transform="translate(190,150)">
    <circle r="130" fill="url(#burst)">
      <animate attributeName="r" values="120;135;120" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- radiating impact lines -->
    <g stroke="#3da9fc" stroke-width="2.5" opacity="0.55">
      <line x1="0" y1="0" x2="0" y2="-150"><animate attributeName="opacity" values="0.55;0.15;0.55" dur="1.8s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="106" y2="-106"><animate attributeName="opacity" values="0.4;0.6;0.4" dur="2s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="150" y2="0"><animate attributeName="opacity" values="0.55;0.15;0.55" dur="1.6s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="106" y2="106"><animate attributeName="opacity" values="0.4;0.6;0.4" dur="2.3s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="-106" y2="106"><animate attributeName="opacity" values="0.55;0.15;0.55" dur="1.9s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="-150" y2="0"><animate attributeName="opacity" values="0.4;0.6;0.4" dur="2.1s" repeatCount="indefinite"/></line>
      <line x1="0" y1="0" x2="-106" y2="-106"><animate attributeName="opacity" values="0.55;0.15;0.55" dur="1.7s" repeatCount="indefinite"/></line>
    </g>
  </g>

  <!-- ninja head, subtle idle breathing -->
  <g transform="translate(74.8,24.8) scale(0.45)">
    <animateTransform attributeName="transform" type="scale"
      additive="sum" values="1;1.03;1" dur="2.6s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    <path fill="#0b1120" stroke="#3da9fc" stroke-width="6" filter="url(#softGlow)" d="M280.054 19.867c-64.315 0-121.76 28.793-159.643 73.934 27.387.07 87.928 3.05 96.12 25.726-38.414-12.105-79.753-11.26-108.534-9.302a201.013 201.013 0 0 0-13.656 23.314c31.507-8.307 147.998-3.37 154.8 21.268-75.985-18.624-140.59-8.65-162.058-4.895-8.768 22.446-13.584 46.805-13.584 72.272 0 111.736 96.248 269.949 210.324 269.949 57.808 0 109.1-40.63 145.637-95.248-31.403 23.812-98.04 57.308-139.002 34.648 81.592-8.994 139.965-50.978 156.19-63.353 25.207-47.142 39.959-100.432 39.959-145.996 0-111.737-92.477-202.317-206.553-202.317zm-.002 151.692c105.084 0 190.273 27.727 190.273 61.931 0 22.047-4.495 33.48-57.797 44.453-29.39 6.052-95.127-31.181-132.476-31.181-34.864 0-87.12 41.345-115.219 36.017-56.597-10.732-75.053-26.433-75.053-49.289 0-34.204 85.188-61.931 190.272-61.931zm83.885 39.894c-20.14-.12-41.571 3.295-41.475 9.91.182 12.453 17.364 22.298 38.377 21.99 21.013-.306 18.555-16.216 37.717-23.101-.085-5.837-16.85-8.693-34.62-8.799zm-172.682 2.883c-17.77.105-34.534 2.964-34.62 8.8 19.162 6.885 16.704 22.796 37.718 23.102 21.013.307 38.195-9.54 38.377-21.992.096-6.615-21.336-10.03-41.475-9.91zm92.57 82.441c31.032 0 56.188 25.235 56.188 25.235s-28.184-11.104-59.217-11.104c-31.032 0-53.16 11.104-53.16 11.104s25.156-25.235 56.19-25.235zM31.25 411.39c4.344 2.046 7.783-40.336 52.246-61.265-8.111-8.465-12.438-24.638-14.24-35.502-32.733 4.158-55.012 84.887-38.006 96.767zm56.31-41.694c-7.511-.052-17.26-.228-17.445 16.937-.498 46.31-42.805 96.953-40.128 98.215 7.138 3.364 49.598-32.077 61.906-59.44 4.159-9.244 11.516-55.603-4.333-55.712z"/>
  </g>

  <!-- name + tagline -->
  <text x="420" y="130" font-family="Verdana, Arial, sans-serif" font-size="46" font-weight="bold" fill="#e2e8f0">
    Zaid Haris Saigal
  </text>
  <text x="420" y="168" font-family="Verdana, Arial, sans-serif" font-size="20" fill="#3da9fc">
    Full-Stack Developer
  </text>
  <text x="420" y="196" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#8b98b0">
    Code hits different when you build it with intent
  </text>
</svg>